name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make xsltproc libxml2-utils
      - name: Validate
        run: make valid
      - name: Build HTML
        run: make html single
      - uses: actions/upload-artifact@v4
        with:
          name: dhs-html
          path: build/dhs
